name: Bug report
description: Report a reproducible repository, documentation, or workflow problem.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Environment and context
      description: Include OS, Python version, Aspen HYSYS version, or repository context if relevant.
      placeholder: Windows 11, Python 3.13, Aspen HYSYS V15, Codex desktop
  - type: dropdown
    id: control_lane
    attributes:
      label: Related control lane
      options:
        - Documentation / repository only
        - Project-local runner
        - Direct COM / HYSYS.Application
        - Spreadsheet / Aspen Simulation Workbook
        - Excel / VBA bridge
        - GUI / visual check
        - Not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Logs, screenshots, or artifacts
      description: Paste non-sensitive diagnostics only. Do not include secrets or proprietary simulation data.
